# Builds and tests SlopCap on Linux, Windows and macOS. Started by hand only (Actions → ci → Run workflow): on a private
# repository every run costs minutes. tools/ci-local.sh runs the same Linux and Windows jobs locally in Docker.
#   linux         docker/build.sh in the project's build image (docker/Dockerfile: Ubuntu 26.04, GCC 15, Qt 6, the
#                  ZWO / QHY SDKs and INDI from the INDI PPA, Xvfb + Mesa): debug, ASan + UBSan and TSan with tests,
#                  and release, packed as slopcap-linux-x64.zip (tools/package.sh) and started in a bare Ubuntu.
#   coverage       every test on a gcov build; fails below 90 % of src/ lines (tools/coverage.sh), report attached.
#   windows-exe    the self-contained slopcap.exe (MinGW + static Qt, docker/Dockerfile.mingw), and
#                  slopcap-windows-x64.zip. The camera DLLs are proprietary and not in the repository, so this exe has
#                  no ZWO / QHY support.
#   windows-smoke  starts that exe on a real Windows runner: replays a generated recording and records it.
#   macos          Apple silicon: Homebrew Qt, the camera SDKs (tools/macos-sdks.sh), INDI (tools/macos-indi.sh,
#                  cached), macos-debug with every test, then SlopCap.app, SlopCap.dmg and slopcap-macos-arm64.zip,
#                  and a run of the app.
# Docker layers live in the Actions cache, so the images (static Qt for Windows takes about an hour) build once.
# Minutes: GitHub bills macOS x10 and Windows x2 for private repositories.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    concurrency: {group: "linux-${{ github.ref }}-${{ matrix.preset }}", cancel-in-progress: true}
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-asan, linux-tsan, linux-release]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image (cached)
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          tags: slopcap-build:ci
          load: true
          cache-from: type=gha,scope=linux
          # every job that builds the image saves it: one getting through rebuilds it for all (the INDI PPA on
          # Launchpad has outages, and an expired cache otherwise waits for all of them to get through at once)
          cache-to: type=gha,scope=linux,mode=max
      - name: Tag the image as docker/build.sh expects
        run: docker tag slopcap-build:ci "slopcap-build:$(sha256sum < docker/Dockerfile | cut -c1-12)"
      - name: Sanitizers need fewer ASLR bits than the runner's kernel uses
        if: contains(matrix.preset, 'san')
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Build and test
        run: SLOPCAP_REGISTRY= docker/build.sh ${{ matrix.preset }}
      - name: Package (slopcap-linux-x64.zip)
        if: matrix.preset == 'linux-release'
        run: tools/package.sh linux
      - name: Start the package in a bare Ubuntu (no Qt, only what a desktop has)
        if: matrix.preset == 'linux-release'
        run: |
          docker run --rm -v "$PWD:/src:ro" ubuntu:26.04 bash -euc '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends python3 libgl1 libegl1 libopengl0 libfontconfig1 libharfbuzz0b               libdbus-1-3 libglib2.0-0t64 libx11-xcb1 libxcb1 libudev1 >/dev/null
            cd /tmp && python3 -m zipfile -e /src/build/package/slopcap-linux-x64.zip . && chmod +x slopcap-linux-x64/slopcap slopcap-linux-x64/bin/slopcap
            python3 /src/tools/package/make-test-ser.py test.ser
            QT_QPA_PLATFORM=offscreen slopcap-linux-x64/slopcap --settings /tmp/settings --camera sim:test.ser --record --out /tmp/rec               --quit-after 4 --screenshot /tmp/shot.png
            ls -l /tmp/rec/*.ser /tmp/shot.png'
      - uses: actions/upload-artifact@v4
        if: matrix.preset == 'linux-release'
        with:
          name: slopcap-linux-x64
          path: build/package/slopcap-linux-x64.zip
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-24.04
    concurrency: {group: "coverage-${{ github.ref }}", cancel-in-progress: true}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image (cached)
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          tags: slopcap-build:ci
          load: true
          cache-from: type=gha,scope=linux
          cache-to: type=gha,scope=linux,mode=max
      - name: Tag the image as docker/build.sh expects
        run: docker tag slopcap-build:ci "slopcap-build:$(sha256sum < docker/Dockerfile | cut -c1-12)"
      - name: Test with coverage (at least 90 % of src/)
        run: SLOPCAP_REGISTRY= tools/coverage.sh 90
      - name: Report
        if: always()
        run: |
          { echo '```'; tail -n 12 build/linux-coverage/coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            build/linux-coverage/coverage.txt
            build/linux-coverage/coverage.json

  windows-exe:
    runs-on: ubuntu-24.04
    # A newer push waits rather than cancelling: an uncached static Qt build (about an hour) should get to finish.
    concurrency: {group: "windows-exe-${{ github.ref }}", cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space (building static Qt needs room)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Build the Windows build image (cached)
        uses: docker/bake-action@v6
        with:
          source: .
          files: .github/docker-bake.hcl
          targets: mingw
          load: true
      - name: Build slopcap.exe
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:$PWD" -w "$PWD" slopcap-build-mingw:ci \
            bash -c "cmake --preset windows-static && cmake --build --preset windows-static"
      - uses: actions/upload-artifact@v4
        with:
          name: slopcap-windows-x64-no-camera-sdks
          path: build/windows-static/slopcap.exe
          if-no-files-found: error
      - name: Package (slopcap-windows-x64.zip)
        run: tools/package.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: slopcap-windows-x64-zip-no-camera-sdks
          path: build/package/slopcap-windows-x64.zip
          if-no-files-found: error

  windows-smoke:
    needs: windows-exe
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: slopcap-windows-x64-no-camera-sdks
      - name: Make a small test recording (a drifting disc, 8-bit mono SER)
        shell: python
        run: |
          import math, struct
          w, h, n = 160, 120, 120
          with open("ci.ser", "wb") as f:
              f.write(struct.pack("<14s7i40s40s40sqq", b"LUCAM-RECORDER", 0, 0, 0, w, h, 8, n,
                                  b"ci", b"synthetic", b"", 0, 0))
              for k in range(n):
                  cx, cy = 80 + 15 * math.sin(k / 15), 60
                  f.write(bytes(220 if (x - cx) ** 2 + (y - cy) ** 2 < 400 else 12 for y in range(h) for x in range(w)))
      - name: Start slopcap.exe, replay and record, quit
        timeout-minutes: 5
        shell: pwsh
        run: |
          # The runner has no GPU, so no OpenGL 3.3: the preview must say so and capture must carry on.
          $env:QT_LOGGING_RULES = "qt.qpa.gl=true"   # Qt's GL context choice into the session log
          $out = Join-Path $env:RUNNER_TEMP "rec"
          New-Item -ItemType Directory -Force $out | Out-Null
          $p = Start-Process -FilePath .\slopcap.exe -PassThru -Wait -ArgumentList @(
            "--settings", (Join-Path $env:RUNNER_TEMP "settings"), "--camera", "sim:ci.ser",
            "--record", "--out", $out, "--quit-after", "8")
          $log = Get-ChildItem "$env:LOCALAPPDATA\SlopCap\SlopCap\logs" -Filter *.log | Sort-Object LastWriteTime | Select-Object -Last 1
          Get-Content $log.FullName
          if ($p.ExitCode -ne 0) { throw "slopcap.exe exited with $($p.ExitCode)" }
          if (-not (Select-String -Path $log.FullName -Pattern "record: start" -Quiet)) { throw "recording didn't start" }
          $ser = Get-ChildItem $out -Filter *.ser
          if (-not $ser) { throw "no recording written" }
          $ser | Format-Table Name, Length
          if (-not (Select-String -Path $log.FullName -Pattern "preview: The preview needs OpenGL 3.3" -Quiet)) {
            Write-Warning "no 'preview needs OpenGL 3.3' line: this runner has a GL 3.3 context after all?"
          }
      - name: If it crashed, where (Windows Error Reporting)
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{LogName = 'Application'; ProviderName = 'Application Error'} -MaxEvents 3 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, Message

  macos:
    runs-on: macos-15
    concurrency: {group: "macos-${{ github.ref }}", cancel-in-progress: true}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Homebrew packages (SlopCap, and what INDI links against)
        run: brew install qtbase ninja pkgconf catch2 libusb cfitsio libnova gsl fftw libev erfa jpeg-turbo
      - name: INDI cache key
        id: indi-key
        run: |
          deps=$(brew list --versions cfitsio libnova gsl fftw libev erfa jpeg-turbo libusb | shasum | cut -c1-10)
          echo "key=indi-2.2.5-$(uname -m)-macos$(sw_vers -productVersion | cut -d. -f1)-$deps-${{ hashFiles('tools/macos-indi.sh') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: indi
        with:
          path: ~/indi
          key: ${{ steps.indi-key.outputs.key }}
      - name: Build INDI (cache miss only)
        if: steps.indi.outputs.cache-hit != 'true'
        run: tools/macos-indi.sh ~/indi
      - name: Camera SDKs
        run: tools/macos-sdks.sh
      - name: Build (macos-debug)
        run: cmake --preset macos-debug && cmake --build --preset macos-debug
      - name: Test
        run: PATH=~/indi/bin:$PATH ctest --preset macos-debug
      - name: Camera probe (no cameras here; must not crash)
        run: |
          set +e
          build/macos-debug/tools/camprobe/slopcap-camprobe 2>&1 | grep -v '^QHYCCD|\|^\[QHYDEMO'
          rc=${PIPESTATUS[0]}
          echo "exit $rc (1 = no cameras found, as expected here)"
          [ "$rc" -le 1 ]
      - name: SlopCap.app and SlopCap.dmg
        run: |
          tools/macos-app.sh --dmg
          ls build/macos-release/SlopCap.app/Contents/Frameworks | grep -E 'ASICamera2|qhyccd|libusb'
      - name: Package (slopcap-macos-arm64.zip)
        run: tools/package.sh macos
      - name: Start the packaged app (replay a recording, record it, quit)
        timeout-minutes: 5
        run: |
          cd "$RUNNER_TEMP" && ditto -x -k "$GITHUB_WORKSPACE/build/package/slopcap-macos-arm64.zip" .
          python3 "$GITHUB_WORKSPACE/tools/package/make-test-ser.py" test.ser
          slopcap-macos-arm64/SlopCap.app/Contents/MacOS/SlopCap --settings "$RUNNER_TEMP/settings" --camera sim:test.ser --record             --out "$RUNNER_TEMP/rec" --quit-after 6 --screenshot "$RUNNER_TEMP/shot.png"
          ls -l "$RUNNER_TEMP"/rec/*.ser "$RUNNER_TEMP/shot.png"
      - uses: actions/upload-artifact@v4
        with:
          name: SlopCap-macos-arm64
          path: build/macos-release/SlopCap.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: slopcap-macos-arm64
          path: build/package/slopcap-macos-arm64.zip
          if-no-files-found: error
